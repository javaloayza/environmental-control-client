
<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '25rem' }">
    <ng-template #header>
        <div class="font-semibold text-xl">Company</div>
    </ng-template>
    <div class="flex flex-col gap-2 mb-2">
        <label for="username" class="font-semibold w-24">NAME</label>
        <input pInputText id="name" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex flex-col gap-2 mb-2">
        <label for="ruc" class="font-semibold w-24">RUC</label>
        <input pInputText id="ruc" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex flex-col gap-2 mb-2">
        <label for="country" class="font-semibold w-24">Country</label>
        <input pInputText id="country" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex flex-col gap-2 mb-2">
        <label for="state" class="font-semibold w-24">State</label>
        <input pInputText id="state" class="flex-auto" autocomplete="off" />
    </div>
    <ng-template #footer>
        <p-button label="Cancel" [text]="true" severity="secondary" (click)="visible = false" />
        <p-button label="Save" [outlined]="true" (click)="visible = false" />
    </ng-template>
</p-dialog>
