<p-dialog [visible]="visible()" (visibleChange)="visible.set($event)" [modal]="true" [style]="{ width: '30rem' }">
    <ng-template #header>
        <div class="font-semibold text-xl">
          @if(mode === 'Create'){
            {{ 'parameter.create' | ct:'Crear Parámetro' }}
          } @else {
            {{ 'parameter.update' | ct:'Editar Parámetro' }}
          }
        </div>
    </ng-template>

    <form [formGroup]="parameterForm" class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
            <label for="name" class="font-semibold">{{ 'parameter.name' | ct:'Nombre' }}</label>
            <input
                pInputText
                id="name"
                class="flex-auto"
                autocomplete="off"
                formControlName="name"
                [class.ng-invalid]="parameterForm.get('name')?.invalid && parameterForm.get('name')?.touched"
            />
        </div>

        <div class="flex flex-col gap-2">
            <label for="description" class="font-semibold">{{ 'parameter.description' | ct:'Descripción' }}</label>
            <textarea
                pTextarea
                id="description"
                rows="3"
                class="flex-auto"
                formControlName="description"
                [class.ng-invalid]="parameterForm.get('description')?.invalid && parameterForm.get('description')?.touched"
            ></textarea>
        </div>

        <div class="flex flex-col gap-2">
            <label for="defaultUnit" class="font-semibold">{{ 'parameter.unit' | ct:'Unidad por Defecto' }}</label>
            <input
                pInputText
                id="defaultUnit"
                class="flex-auto"
                autocomplete="off"
                formControlName="defaultUnit"
                [class.ng-invalid]="parameterForm.get('defaultUnit')?.invalid && parameterForm.get('defaultUnit')?.touched"
            />
        </div>

        <div class="flex flex-col gap-2">
            <label for="status" class="font-semibold">{{ 'parameter.status' | ct:'Estado' }}</label>
            <p-select
                [options]="statusOptions"
                formControlName="status"
                optionLabel="label"
                optionValue="value"
                placeholder="Seleccione un estado"
                appendTo="body"
            ></p-select>
        </div>
    </form>

    <ng-template #footer>
        <div class="flex justify-end gap-2">
            <p-button 
                type="button" 
                label="Cancelar" 
                icon="pi pi-times" 
                (onClick)="hideModal()"
                severity="secondary">
            </p-button>
            <p-button
                type="button"
                label="Guardar"
                icon="pi pi-check"
                (onClick)="saveParameter()"
                [loading]="loading()">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
