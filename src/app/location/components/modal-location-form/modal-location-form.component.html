<p-dialog [visible]="visible()" (visibleChange)="visible.set($event)" [modal]="true" [style]="{ width: '25rem' }">
    <ng-template #header>
        <div class="font-semibold text-xl">
          @if(mode === 'Create'){
            {{ 'location.create' | ct:'Crear Ubicación' }}
          } @else {
            {{ 'location.update' | ct:'Editar Ubicación' }}
          }
        </div>
    </ng-template>

    <form [formGroup]="locationForm" class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
            <label for="codeLocation" class="font-semibold">{{ 'location.code' | ct:'Código' }}</label>
            <input
                pInputText
                id="codeLocation"
                class="flex-auto"
                autocomplete="off"
                formControlName="codeLocation"
                [class.ng-invalid]="locationForm.get('codeLocation')?.invalid && locationForm.get('codeLocation')?.touched"
            />
        </div>

        <div class="flex flex-col gap-2">
            <label for="description" class="font-semibold">{{ 'location.description' | ct:'Descripción' }}</label>
            <input
                pInputText
                id="description"
                class="flex-auto"
                autocomplete="off"
                formControlName="description"
                [class.ng-invalid]="locationForm.get('description')?.invalid && locationForm.get('description')?.touched"
            />
        </div>

        <div class="flex flex-col gap-2">
            <label for="longitude" class="font-semibold">{{ 'location.longitude' | ct:'Longitud' }}</label>
            <input
                pInputText
                id="longitude"
                class="flex-auto"
                autocomplete="off"
                formControlName="longitude"
                [class.ng-invalid]="locationForm.get('longitude')?.invalid && locationForm.get('longitude')?.touched"
            />
        </div>

        <div class="flex flex-col gap-2">
            <label for="latitude" class="font-semibold">{{ 'location.latitude' | ct:'Latitud' }}</label>
            <input
                pInputText
                id="latitude"
                class="flex-auto"
                autocomplete="off"
                formControlName="latitude"
                [class.ng-invalid]="locationForm.get('latitude')?.invalid && locationForm.get('latitude')?.touched"
            />
        </div>
    </form>

    <ng-template #footer>
        <p-button
            type="button"
            label="Cancel"
            (onClick)="hideModal()"
        />
        <p-button
            type="button"
            label="Save"
            (onClick)="saveLocation()"
            [loading]="loading"
        />
    </ng-template>
</p-dialog>
